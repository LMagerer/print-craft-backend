[project]
name = "printcraft-backend"
version = "0.1.0"
description = "Card generator backend: template library, Pillow renderer, batch jobs and A4 PDF layout"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pillow>=10.3",
    "pypdfium2>=4.30",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "img2pdf>=0.5",
    "reportlab>=4.2",
    "python-multipart>=0.0.9",
    "fonttools>=4.50",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
